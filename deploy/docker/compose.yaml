# Telegarrm en Docker (docs/instalacion-docker.md). Jellyfin va en su propio compose.
#
# 1. Copia este archivo a una carpeta de tu servidor (por ejemplo /opt/docker/telegarrm/compose.yaml),
#    nunca dentro de una copia del repositorio: tus claves no deben acabar en git.
# 2. Pon tus claves de Telegram (y, si quieres, la de TMDB) y cambia la biblioteca si no es /srv/media.
# 3. docker compose up -d
#
# Las claves de aquí se ven con «docker inspect». Para que no estén ni en este archivo ni en el
# contenedor, usa la variante con Docker secrets de deploy/docker/con-secrets/.

name: telegarrm

services:
  telegarrm:
    image: ghcr.io/placix5/telegarrm:latest
    container_name: telegarrm
    # También al pedir «Reiniciar ahora» en Ajustes (el programa sale con el código 75)
    restart: unless-stopped
    # El dueño de tu biblioteca (Jellyfin lee los archivos con él). Mira el tuyo con «id».
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Madrid
      # De https://my.telegram.org, en «API development tools»
      TELEGARRM_API_ID: ""
      TELEGARRM_API_HASH: ""
      # Opcional: «API Read Access Token» de https://www.themoviedb.org/settings/api
      TELEGARRM_TMDB_TOKEN: ""
    volumes:
      # BD, sesión de Telegram y contraseña de la web. Docker crea el volumen la primera vez.
      - datos:/app/db
      # Tu biblioteca, con la misma ruta dentro que fuera. Tiene que existir y ser del usuario de arriba.
      - /srv/media:/srv/media
    # Solo puede escribir en sus datos, en la biblioteca y en /tmp (en memoria)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Tiempo para cerrar la sesión de Telegram de forma ordenada
    stop_grace_period: 30s

volumes:
  datos:
